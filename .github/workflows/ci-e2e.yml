name: CI (E2E)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5063
      Cors__AllowedOrigins__0: http://localhost:4173
      GlyphForge__BaseUrl: http://127.0.0.1:8080/
      GlyphForge__Timeout: 00:01:00

    steps:
      - name: Check out Mojica
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: bunx playwright install --with-deps chromium webkit

      - name: Check out Glyph Forge
        uses: actions/checkout@v4
        with:
          repository: kishimin/glyph-forge
          ref: b238ea5a1a067d2e4f7e0a27979363b5154a06ba
          path: .ci/glyph-forge

      - name: Build Glyph Forge image
        run: docker build --tag glyph-forge-ci .ci/glyph-forge

      - name: Start Glyph Forge
        run: docker run --detach --name glyph-forge-ci --publish 8080:8080 glyph-forge-ci

      - name: Wait for Glyph Forge
        run: curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/health

      - name: Restore backend dependencies
        working-directory: backend
        run: dotnet restore Mojica.Backend.sln

      - name: Build backend
        working-directory: backend
        run: dotnet build Mojica.Backend.sln --configuration Release --no-restore

      - name: Start Mojica API
        working-directory: backend
        run: |
          nohup dotnet run --project Mojica.Api --configuration Release --no-build > ../mojica-api.log 2>&1 &
          echo $! > ../mojica-api.pid

      - name: Wait for Mojica API
        run: curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:5063/health

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: bun run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload API log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-api-log
          path: mojica-api.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop services
        if: always()
        run: |
          if [ -f mojica-api.pid ]; then kill "$(cat mojica-api.pid)" || true; fi
          docker rm --force glyph-forge-ci || true
