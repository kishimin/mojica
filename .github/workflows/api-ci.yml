name: API CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/api-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/api-ci.yml

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sized-tests:
    name: Test API (${{ matrix.size }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push') && '[{"size":"Small","filter":"FullyQualifiedName~SmallTests"},{"size":"Medium","filter":"FullyQualifiedName~MediumTests"}]' || '[{"size":"Large","filter":"FullyQualifiedName~LargeTests"}]') }}
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}

      - name: Restore dependencies
        run: dotnet restore Mojica.Backend.sln

      - name: Build API
        run: dotnet build Mojica.Backend.sln --configuration Release --no-restore

      - name: Run ${{ matrix.size }} API tests
        run: >-
          dotnet test Mojica.Backend.sln
          --configuration Release
          --no-build
          --filter "${{ matrix.filter }}"
          --logger "trx;LogFileName=${{ matrix.size }}-test-results.trx"
          --results-directory TestResults/${{ matrix.size }}

      - name: Publish test results
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        with:
          files: backend/TestResults/${{ matrix.size }}/**/*.trx

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-${{ matrix.size }}-test-reports
          path: backend/TestResults/${{ matrix.size }}
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: API coverage
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}

      - name: Restore dependencies
        run: dotnet restore Mojica.Backend.sln

      - name: Build API
        run: dotnet build Mojica.Backend.sln --configuration Release --no-restore

      - name: Verify API CI test scheduling
        shell: pwsh
        run: |
          ./scripts/test-api-ci-timing.ps1
          ./scripts/verify-api-ci-coverage-selection.ps1

      - name: Collect API coverage
        run: >-
          dotnet test Mojica.Backend.sln
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~SmallTests|FullyQualifiedName~MediumTests"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Create coverage summary
        if: ${{ !cancelled() && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: backend/TestResults/**/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          output: both
          thresholds: 80 90

      - name: Add coverage for every file
        if: ${{ !cancelled() && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        shell: pwsh
        run: >-
          ./scripts/append-file-coverage.ps1
          -CoverageFiles (Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml).FullName
          -PackageSummaryFile ../code-coverage-results.md
          -SummaryFile ../code-coverage-comment.md

      - name: Publish coverage summary
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: api-coverage
          path: code-coverage-comment.md

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-reports
          path: backend/TestResults
          if-no-files-found: error
          retention-days: 14
