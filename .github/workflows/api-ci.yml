name: API CI

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/api-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/api-ci.yml

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Mojica.Backend.sln

      - name: Build API
        run: dotnet build Mojica.Backend.sln --configuration Release --no-restore

      - name: Run API tests
        run: >-
          dotnet test Mojica.Backend.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Publish test results
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        with:
          files: backend/TestResults/**/*.trx

      - name: Create coverage summary
        if: ${{ !cancelled() && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: backend/TestResults/**/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          output: both
          thresholds: 80 90

      - name: Publish coverage summary
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: api-coverage
          path: code-coverage-results.md

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: backend/TestResults
          if-no-files-found: error
          retention-days: 14
