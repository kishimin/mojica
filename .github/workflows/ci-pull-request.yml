name: CI (Pull Request)

on:
  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/ci-pull-request.yml

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: ci-pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sized-tests:
    name: Test API (${{ matrix.size }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: Small
            filter: FullyQualifiedName~SmallTests
          - size: Medium
            filter: FullyQualifiedName~MediumTests
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Mojica.Backend.sln

      - name: Build API
        run: dotnet build Mojica.Backend.sln --configuration Release --no-restore

      - name: Run ${{ matrix.size }} API tests
        run: >-
          dotnet test Mojica.Backend.sln
          --configuration Release
          --no-build
          --filter "${{ matrix.filter }}"
          --logger "trx;LogFileName=${{ matrix.size }}-test-results.trx"
          --results-directory TestResults/${{ matrix.size }}

      - name: Publish test results
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        with:
          files: backend/TestResults/${{ matrix.size }}/**/*.trx

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-${{ matrix.size }}-test-reports
          path: backend/TestResults/${{ matrix.size }}
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: API coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Mojica.Backend.sln

      - name: Build API
        run: dotnet build Mojica.Backend.sln --configuration Release --no-restore

      - name: Collect API coverage
        run: >-
          dotnet test Mojica.Backend.sln
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~SmallTests|FullyQualifiedName~MediumTests"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Create coverage summary
        if: ${{ !cancelled() && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: backend/TestResults/**/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          output: both
          thresholds: 80 90

      - name: Add coverage for every file
        if: ${{ !cancelled() && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        shell: pwsh
        run: >-
          ./scripts/append-file-coverage.ps1
          -CoverageFiles (Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml).FullName
          -PackageSummaryFile ../code-coverage-results.md
          -SummaryFile ../code-coverage-comment.md

      - name: Publish coverage summary
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: api-coverage
          path: code-coverage-comment.md

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-reports
          path: backend/TestResults
          if-no-files-found: error
          retention-days: 14

  frontend-tests:
    name: Frontend Test (${{ matrix.size }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: Small
            filter: small.test
          - size: Medium
            filter: medium.test
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v3
        id: node_modules_cache
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Cache Playwright's Chromium browser
        uses: actions/cache@v3
        id: playwright_cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Playwright's Chromium browser
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Vitest ${{ matrix.size }} tests
        run: bunx vitest run --coverage ${{ matrix.filter }}

      - name: Report Vitest Result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const TEST_RESULT_PATH = "frontend/test-result.json";

            if (!fs.existsSync(TEST_RESULT_PATH)) {
              console.log(`Test result file not found at ${TEST_RESULT_PATH}.`);
              process.exit(1);
            }

            const result = JSON.parse(fs.readFileSync(TEST_RESULT_PATH, "utf8"));

            if (result.numTotalTests === 0) {
              console.log("No test case.");
              process.exit(1);
            }

            const runLink = `${process.env.GITHUB_SERVER_URL || "https://github.com"}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const COVERAGE_SUMMARY_PATH = "frontend/coverage/coverage-summary.json";

            let coverageSection = "";
            if (fs.existsSync(COVERAGE_SUMMARY_PATH)) {
              const { total } = JSON.parse(fs.readFileSync(COVERAGE_SUMMARY_PATH, "utf8"));
              coverageSection = `
            ## Coverage\n
            - Lines: ${total.lines.pct}% (${total.lines.covered}/${total.lines.total})
            - Statements: ${total.statements.pct}% (${total.statements.covered}/${total.statements.total})
            - Functions: ${total.functions.pct}% (${total.functions.covered}/${total.functions.total})
            - Branches: ${total.branches.pct}% (${total.branches.covered}/${total.branches.total})
            \n`;
            } else {
              console.log(`Coverage summary not found at ${COVERAGE_SUMMARY_PATH}.`);
            }

            const body = `
            # Test Results\n
            **${result.success ? "All tests passed" : "Some tests failed"}**\n
            \n
            ## Test Suites\n
            - Total: ${result.numTotalTestSuites}
              - Passed: ${result.numPassedTestSuites}
              - Failed: ${result.numFailedTestSuites}
              - Pending: ${result.numPendingTestSuites}
            \n
            ## Test Cases\n
            - Total: ${result.numTotalTests}
              - Passed: ${result.numPassedTests}
              - Failed: ${result.numFailedTests}
              - Pending: ${result.numPendingTests}
            \n
            ${coverageSection}## Full Report\n
            (Actions run): ${runLink}\n
            \n
            _Generated by workflow ${process.env.GITHUB_WORKFLOW || ""}_
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ matrix.size }}-test-results
          path: frontend/test-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ matrix.size }}-coverage-report
          path: frontend/coverage
          if-no-files-found: error
          retention-days: 14
