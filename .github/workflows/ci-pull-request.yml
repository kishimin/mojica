name: CI (Pull Request)

on:
  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: ci-pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sized-tests:
    name: Test API (${{ matrix.size }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: Small
            filter: FullyQualifiedName~SmallTests
          - size: Medium
            filter: FullyQualifiedName~MediumTests
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Mojica.Backend.sln

      - name: Build API
        run: dotnet build Mojica.Backend.sln --configuration Release --no-restore

      - name: Run ${{ matrix.size }} API tests
        run: >-
          dotnet test Mojica.Backend.sln
          --configuration Release
          --no-build
          --filter "${{ matrix.filter }}"
          --logger "trx;LogFileName=${{ matrix.size }}-test-results.trx"
          --results-directory TestResults/${{ matrix.size }}

      - name: Publish test results
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        with:
          files: backend/TestResults/${{ matrix.size }}/**/*.trx

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-${{ matrix.size }}-test-reports
          path: backend/TestResults/${{ matrix.size }}
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: API coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Mojica.Backend.sln

      - name: Build API
        run: dotnet build Mojica.Backend.sln --configuration Release --no-restore

      - name: Collect API coverage
        run: >-
          dotnet test Mojica.Backend.sln
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~SmallTests|FullyQualifiedName~MediumTests"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Create coverage summary
        if: ${{ !cancelled() && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: backend/TestResults/**/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          output: both
          thresholds: 80 90

      - name: Add coverage for every file
        if: ${{ !cancelled() && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        shell: pwsh
        run: >-
          ./scripts/append-file-coverage.ps1
          -CoverageFiles (Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml).FullName
          -PackageSummaryFile ../code-coverage-results.md
          -SummaryFile ../code-coverage-comment.md

      - name: Publish coverage summary
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: api-coverage
          path: code-coverage-comment.md

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-reports
          path: backend/TestResults
          if-no-files-found: error
          retention-days: 14

  frontend-tests:
    name: Frontend Test (${{ matrix.size }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: Small
            script: test:small
          - size: Medium
            script: test:medium
          - size: Storybook
            script: test:storybook
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache node_modules
        uses: actions/cache@v3
        id: node_modules_cache
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-bun-1.3.13-${{ hashFiles('frontend/bun.lock') }}

      - name: Install dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Cache Playwright's Chromium browser
        uses: actions/cache@v3
        id: playwright_cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Playwright's Chromium browser
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Vitest ${{ matrix.size }} tests
        run: bun run ${{ matrix.script }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ matrix.size }}-test-results
          path: frontend/test-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('frontend/coverage/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ matrix.size }}-coverage-report
          path: frontend/coverage
          if-no-files-found: error
          retention-days: 14

  frontend-coverage:
    name: Frontend coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache node_modules
        uses: actions/cache@v3
        id: node_modules_cache
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-bun-1.3.13-${{ hashFiles('frontend/bun.lock') }}

      - name: Install dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Cache Playwright's Chromium browser
        uses: actions/cache@v3
        id: playwright_cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Playwright's Chromium browser
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Vitest coverage (Small+Medium)
        run: bun run test:coverage:pr

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('frontend/coverage/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          if-no-files-found: error
          retention-days: 14

  frontend-report:
    name: Frontend Test Report
    needs: frontend-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Small test results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: frontend-Small-test-results
          path: results/Small

      - name: Download Small coverage report
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: frontend-Small-coverage-report
          path: results/Small/coverage

      - name: Download Medium test results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: frontend-Medium-test-results
          path: results/Medium

      - name: Download Medium coverage report
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: frontend-Medium-coverage-report
          path: results/Medium/coverage

      - name: Download Storybook test results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: frontend-Storybook-test-results
          path: results/Storybook

      - name: Download Storybook coverage report
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: frontend-Storybook-coverage-report
          path: results/Storybook/coverage

      - name: Report Vitest Result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            function readJson(path) {
              if (!fs.existsSync(path)) return null;
              return JSON.parse(fs.readFileSync(path, "utf8"));
            }

            const sizes = ["Small", "Medium", "Storybook"];
            const sections = [];
            let anyTests = false;

            for (const size of sizes) {
              const result = readJson(`results/${size}/test-result.json`);
              if (!result) {
                console.log(`No test result for ${size}.`);
                continue;
              }
              if (result.numTotalTests > 0) {
                anyTests = true;
              }

              const coverage = readJson(`results/${size}/coverage/coverage-summary.json`);
              let coverageSection = "";
              if (coverage) {
                const { total } = coverage;
                coverageSection = `

            ### Coverage
            - Lines: ${total.lines.pct}% (${total.lines.covered}/${total.lines.total})
            - Statements: ${total.statements.pct}% (${total.statements.covered}/${total.statements.total})
            - Functions: ${total.functions.pct}% (${total.functions.covered}/${total.functions.total})
            - Branches: ${total.branches.pct}% (${total.branches.covered}/${total.branches.total})`;
              }

              sections.push(`
            ## ${size}
            **${result.success ? "All tests passed" : "Some tests failed"}**

            - Suites: ${result.numTotalTestSuites} (Passed: ${result.numPassedTestSuites}, Failed: ${result.numFailedTestSuites}, Pending: ${result.numPendingTestSuites})
            - Cases: ${result.numTotalTests} (Passed: ${result.numPassedTests}, Failed: ${result.numFailedTests}, Pending: ${result.numPendingTests})${coverageSection}
            `);
            }

            if (!anyTests) {
              console.log("No test case in any size.");
              process.exit(1);
            }

            const runLink = `${process.env.GITHUB_SERVER_URL || "https://github.com"}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const body = `
            # Frontend Test Results
            ${sections.join("\n")}
            ## Full Report
            (Actions run): ${runLink}

            _Generated by workflow ${process.env.GITHUB_WORKFLOW || ""}_
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
