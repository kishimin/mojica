name: CI (Push)

on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  small-tests:
    name: Test API (Small)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Mojica.Backend.sln

      - name: Build API
        run: dotnet build Mojica.Backend.sln --configuration Release --no-restore

      - name: Run Small API tests
        run: >-
          dotnet test Mojica.Backend.sln
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~SmallTests"
          --logger "trx;LogFileName=Small-test-results.trx"
          --results-directory TestResults/Small

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        with:
          files: backend/TestResults/Small/**/*.trx

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-small-test-reports
          path: backend/TestResults/Small
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: API coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Mojica.Backend.sln

      - name: Build API
        run: dotnet build Mojica.Backend.sln --configuration Release --no-restore

      - name: Collect API coverage
        run: >-
          dotnet test Mojica.Backend.sln
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~SmallTests"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Create coverage summary
        if: ${{ !cancelled() && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: backend/TestResults/**/coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          output: both
          thresholds: 80 90

      - name: Add coverage for every file
        if: ${{ !cancelled() && hashFiles('backend/TestResults/**/coverage.cobertura.xml') != '' }}
        shell: pwsh
        run: >-
          ./scripts/append-file-coverage.ps1
          -CoverageFiles (Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml).FullName
          -PackageSummaryFile ../code-coverage-results.md
          -SummaryFile ../code-coverage-comment.md

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-reports
          path: backend/TestResults
          if-no-files-found: error
          retention-days: 14

  frontend-small-tests:
    name: Frontend Test (Small)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache node_modules
        uses: actions/cache@v3
        id: node_modules_cache
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-bun-1.3.13-${{ hashFiles('frontend/bun.lock') }}

      - name: Install dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Cache Playwright's Chromium browser
        uses: actions/cache@v3
        id: playwright_cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Playwright's Chromium browser
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Vitest Small tests
        run: bun run test:small

      - name: Report Vitest Result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const TEST_RESULT_PATH = "frontend/test-result.json";

            if (!fs.existsSync(TEST_RESULT_PATH)) {
              console.log(`Test result file not found at ${TEST_RESULT_PATH}.`);
              process.exit(1);
            }

            const result = JSON.parse(fs.readFileSync(TEST_RESULT_PATH, "utf8"));

            if (result.numTotalTests === 0) {
              console.log("No test case.");
              process.exit(1);
            }

            const COVERAGE_SUMMARY_PATH = "frontend/coverage/coverage-summary.json";

            let coverageSection = "";
            if (fs.existsSync(COVERAGE_SUMMARY_PATH)) {
              const { total } = JSON.parse(fs.readFileSync(COVERAGE_SUMMARY_PATH, "utf8"));
              coverageSection = `
            ## Coverage\n
            - Lines: ${total.lines.pct}% (${total.lines.covered}/${total.lines.total})
            - Statements: ${total.statements.pct}% (${total.statements.covered}/${total.statements.total})
            - Functions: ${total.functions.pct}% (${total.functions.covered}/${total.functions.total})
            - Branches: ${total.branches.pct}% (${total.branches.covered}/${total.branches.total})
            \n`;
            } else {
              console.log(`Coverage summary not found at ${COVERAGE_SUMMARY_PATH}.`);
            }

            const body = `
            # Test Results\n
            **${result.success ? "All tests passed" : "Some tests failed"}**\n
            \n
            ## Test Suites\n
            - Total: ${result.numTotalTestSuites}
              - Passed: ${result.numPassedTestSuites}
              - Failed: ${result.numFailedTestSuites}
              - Pending: ${result.numPendingTestSuites}
            \n
            ## Test Cases\n
            - Total: ${result.numTotalTests}
              - Passed: ${result.numPassedTests}
              - Failed: ${result.numFailedTests}
              - Pending: ${result.numPendingTests}
            \n
            ${coverageSection}
            `;

            await core.summary.addRaw(body).write();

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-small-test-results
          path: frontend/test-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('frontend/coverage/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-small-coverage-report
          path: frontend/coverage
          if-no-files-found: error
          retention-days: 14

  frontend-e2e-small:
    name: Frontend E2E (Small)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5063
      Cors__AllowedOrigins__0: http://localhost:4173
      GlyphForge__BaseUrl: http://127.0.0.1:8080/
      GlyphForge__Timeout: 00:01:00
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium webkit
      - uses: actions/checkout@v4
        with:
          repository: kishimin/glyph-forge
          ref: b238ea5a1a067d2e4f7e0a27979363b5154a06ba
          path: .ci/glyph-forge
      - name: Start Glyph Forge
        run: |
          docker build --tag glyph-forge-ci .ci/glyph-forge
          docker run --detach --name glyph-forge-ci --publish 8080:8080 glyph-forge-ci
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/health
      - name: Build and start Mojica API
        working-directory: backend
        run: |
          dotnet restore Mojica.Backend.sln
          dotnet build Mojica.Backend.sln --configuration Release --no-restore
          nohup dotnet run --project Mojica.Api --configuration Release --no-build > ../mojica-api.log 2>&1 &
          echo $! > ../mojica-api.pid
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:5063/health
      - name: Build frontend
        working-directory: frontend
        run: bun run build
      - name: Run Small E2E tests
        working-directory: frontend
        run: bun run e2e
      - name: Upload E2E artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-small-results
          path: |
            frontend/playwright-report
            frontend/test-results
            mojica-api.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop E2E services
        if: always()
        run: |
          if [ -f mojica-api.pid ]; then kill "$(cat mojica-api.pid)" || true; fi
          docker rm --force glyph-forge-ci || true
